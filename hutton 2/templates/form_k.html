{% extends "base.html" %}
{% block title %}Form K — Hutton{% endblock %}
{% block content %}
<h1>Form K</h1>
<form method="POST">
  <div class="form-group"><label>Owner Name</label><input type="text" name="owner_name" required /></div>
  <div class="form-group"><label>Unit Number and Building</label><input type="text" name="unit_number_and_building" required /></div>
  <div class="form-group"><label>Tenant Name</label><input type="text" name="tenant_name" required /></div>
  <div class="form-group"><label>Tenancy Start Date</label><input type="text" name="tenancy_start_date" required /></div>
  <div class="form-group"><label>Email</label><input type="text" name="email" required /></div>
  <button type="submit" class="pill-btn">Submit</button>
</form>
{% endblock %}
