{% extends "base.html" %}
{% block title %}Owner Registration — Hutton{% endblock %}
{% block content %}
<h1>Owner Registration</h1>
<form method="POST">
  <div class="form-group"><label>Full Name</label><input type="text" name="full_name" required /></div>
  <div class="form-group"><label>Unit Number and Building</label><input type="text" name="unit_number_and_building" required /></div>
  <div class="form-group"><label>Mailing Address</label><input type="text" name="mailing_address" required /></div>
  <div class="form-group"><label>Email Address</label><input type="text" name="email_address" required /></div>
  <div class="form-group"><label>Phone Number</label><input type="text" name="phone_number" required /></div>
  <div class="form-group"><label>Date of Purchase</label><input type="text" name="date_of_purchase" required /></div>
  <button type="submit" class="pill-btn">Submit</button>
</form>
{% endblock %}
