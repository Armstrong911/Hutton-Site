<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Hutton</title>
  <link href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #fff; color: #1d1d1f; font-family: 'PT Serif', Georgia, serif; -webkit-font-smoothing: antialiased; min-height: 100%; }
    .page { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 60px 24px; gap: 36px; }
    .logo-wrap { width: 150%; max-width: none; text-align: center; opacity: 0; animation: fadeDown 0.8s ease 0.2s forwards; }
    .logo-wrap img { width: 150%; max-width: none; filter: brightness(0); display: block; margin: 0 auto; }
    .logo-text { display: none; font-size: 1.6rem; font-weight: 700; color: #1d1d1f; letter-spacing: .05em; }
    .prompt { color: rgba(0,0,0,0); font-size: clamp(1rem,3.5vw,1.25rem); animation: labelFade 0.8s ease 0.7s forwards; letter-spacing: .01em; text-align: center; }
    .input-wrap { width: 100%; max-width: 460px; position: relative; height: 54px; }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    .wbox { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #fafafa; border: 1px solid rgba(0,0,0,0.12); border-radius: 2px; display: flex; align-items: center; padding: 0 44px 0 16px; opacity: 0; transition: opacity 0.3s ease; }
    .wbox input { background: none; border: none; outline: none; width: 100%; font-family: 'PT Serif', Georgia, serif; font-size: .95rem; color: #1d1d1f; -webkit-appearance: none; }
    .wbox input::placeholder { color: rgba(0,0,0,0.3); }
    .send-btn { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: rgba(0,0,0,0.4); font-size: 1.1rem; padding: 8px; line-height: 1; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    .send-btn:hover { color: #1d1d1f; }
    .result { font-size: .95rem; color: rgba(0,0,0,0.7); min-height: 1.4em; text-align: center; max-width: 460px; }
    .result a { display: inline-block; margin-top: 8px; color: #1d1d1f; text-decoration: none; border-bottom: 1px solid rgba(0,0,0,0.25); padding-bottom: 1px; font-size: .9rem; letter-spacing: .03em; }
    .result a:hover { border-color: #1d1d1f; }
    @keyframes fadeDown  { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }
    @keyframes labelFade { from{opacity:0;transform:translateY(6px);color:rgba(0,0,0,0)} to{opacity:1;transform:translateY(0);color:rgba(0,0,0,0.8)} }
    @media (max-width: 480px) { .page { padding: 48px 20px; gap: 28px; } .input-wrap { height: 50px; } }
  </style>
</head>
<body>
<div class="page">
  <div class="logo-wrap">
    <img src="https://huttonpropertymanagement.com/wp-content/uploads/Hutton-Word-Smaller.png"
         onerror="this.style.display='none'; document.getElementById('lt').style.display='block';" />
    <span id="lt" class="logo-text">HUTTON</span>
  </div>
  <div class="prompt">How can we help you today?</div>
  <div class="input-wrap">
    <canvas id="wcanvas"></canvas>
    <div class="wbox" id="wbox">
      <input type="text" id="query" placeholder="Type what you're looking for…" autocomplete="off" autocorrect="off" autocapitalize="off" />
      <button class="send-btn" onclick="sendQuery()">→</button>
    </div>
  </div>
  <div class="result" id="result"></div>
</div>
<script>
const canvas=document.getElementById('wcanvas'), ctx=canvas.getContext('2d'), wbox=document.getElementById('wbox');
const queryEl=document.getElementById('query'), resultEl=document.getElementById('result');
const DURATION=2280, N=700;
let particles=[], startTime=null, raf;
function resize(){ const r=canvas.parentElement.getBoundingClientRect(); canvas.width=r.width||460; canvas.height=r.height||54; }
function easeOut(t){ return 1-Math.pow(1-t,3); }
function build(){
  const w=canvas.width, h=canvas.height, p=2*(w+h); particles=[];
  for(let i=0;i<N;i++){
    const pos=(i/N)*p; let tx,ty;
    if(pos<w){tx=pos;ty=0;} else if(pos<w+h){tx=w;ty=pos-w;} else if(pos<2*w+h){tx=w-(pos-w-h);ty=h;} else{tx=0;ty=h-(pos-2*w-h);}
    particles.push({x:(Math.random()-.5)*w*3.5+w/2,y:(Math.random()-.5)*h*6+h/2,tx,ty,size:Math.random()*1.8+0.5,delay:Math.random()*0.4});
  }
}
function animate(ts){
  if(!startTime) startTime=ts;
  const raw=Math.min((ts-startTime)/DURATION,1);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(const p of particles){
    const lr=Math.max(0,Math.min((raw-p.delay)/(1-p.delay),1)), t=easeOut(lr);
    ctx.fillStyle=`rgba(0,0,0,${0.06+t*0.65})`;
    ctx.fillRect(p.x+(p.tx-p.x)*t,p.y+(p.ty-p.y)*t,p.size,p.size);
  }
  if(raw<0.88){raf=requestAnimationFrame(animate);} else{ctx.clearRect(0,0,canvas.width,canvas.height);wbox.style.opacity='1';queryEl.focus();}
}
window.addEventListener('resize',resize); resize(); build();
setTimeout(()=>{raf=requestAnimationFrame(animate);},900);
queryEl.addEventListener('keydown',e=>{if(e.key==='Enter')sendQuery();});
async function sendQuery(){
  const q=queryEl.value.trim(); if(!q) return;
  resultEl.textContent='Looking that up…';
  try{
    const res=await fetch('/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q})});
    const data=await res.json();
    resultEl.innerHTML='';
    if(data.message) resultEl.appendChild(document.createTextNode(data.message));
    if(data.url){
      const a=document.createElement('a');
      a.href=data.url; a.textContent=(data.destination_name||'Go')+' →';
      if(data.url.startsWith('http')) a.target='_blank';
      resultEl.appendChild(a);
    }
  } catch(e){ resultEl.textContent='Something went wrong. Please try again.'; }
}
</script>
</body>
</html>
