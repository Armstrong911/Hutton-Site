<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>{% block title %}Hutton{% endblock %}</title>
  <link href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #f5f5f7; color: #1d1d1f; font-family: 'PT Serif', Georgia, serif; -webkit-font-smoothing: antialiased; min-height: 100%; }
    .top-bar { padding: 20px 24px 0; }
    .top-bar a { font-size: .85rem; color: rgba(0,0,0,0.38); text-decoration: none; letter-spacing: .03em; }
    .top-bar a:hover { color: #1d1d1f; }
    .container { max-width: 720px; margin: 0 auto; padding: 32px 24px 80px; }
    h1 { font-size: clamp(1.6rem,5vw,2.4rem); font-weight: 700; margin-bottom: 12px; letter-spacing: -.01em; line-height: 1.2; }
    h2 { font-size: clamp(1.05rem,3vw,1.25rem); font-weight: 700; margin: 28px 0 10px; }
    p  { font-size: clamp(.93rem,2.5vw,1rem); line-height: 1.75; color: rgba(0,0,0,0.72); margin-bottom: 16px; }
    .card { background: #fff; border-radius: 18px; border: 0.5px solid rgba(0,0,0,0.08); padding: 26px 22px; margin-bottom: 14px; }
    .pill-btn { display: inline-block; background: #1d1d1f; color: #fff; font-family: 'PT Serif', Georgia, serif; font-size: .9rem; letter-spacing: .04em; padding: 14px 36px; border-radius: 980px; border: none; cursor: pointer; text-decoration: none; transition: opacity 0.2s; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    .pill-btn:hover { opacity: 0.82; }
    .form-group { margin-bottom: 28px; }
    .form-group label { display: block; font-size: .73rem; letter-spacing: .09em; text-transform: uppercase; color: rgba(0,0,0,0.42); margin-bottom: 10px; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; background: none; border: none; border-bottom: 1px solid rgba(0,0,0,0.18); padding: 10px 0; font-family: 'PT Serif', Georgia, serif; font-size: 1rem; color: #1d1d1f; outline: none; transition: border-color 0.2s; -webkit-appearance: none; border-radius: 0; }
    .form-group input:focus, .form-group textarea:focus { border-bottom-color: #1d1d1f; }
    .form-group textarea { resize: vertical; min-height: 110px; }
    .accordion-item { border-bottom: 0.5px solid rgba(0,0,0,0.1); }
    .accordion-btn { width: 100%; background: none; border: none; display: flex; justify-content: space-between; align-items: center; padding: 20px 0; cursor: pointer; font-family: 'PT Serif', Georgia, serif; font-size: clamp(.93rem,2.5vw,1rem); color: #1d1d1f; text-align: left; gap: 16px; -webkit-tap-highlight-color: transparent; }
    .accordion-icon { font-size: 1.2rem; flex-shrink: 0; transition: transform 0.3s; }
    .accordion-body { display: none; padding: 0 0 20px; color: rgba(0,0,0,0.7); line-height: 1.75; font-size: clamp(.88rem,2.5vw,.95rem); }
    .accordion-item.open .accordion-body { display: block; }
    .accordion-item.open .accordion-icon { transform: rotate(45deg); }
    @media (max-width: 480px) { .container { padding: 24px 18px 60px; } .card { padding: 20px 16px; } }
  </style>
</head>
<body>
<div class="top-bar"><a href="/">← Hutton</a></div>
<div class="container">{% block content %}{% endblock %}</div>
<script>
  document.querySelectorAll('.accordion-btn').forEach(btn => {
    btn.addEventListener('click', () => btn.closest('.accordion-item').classList.toggle('open'));
  });
</script>
</body>
</html>
