<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>{% block title %}Hutton{% endblock %}</title>
  <link href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #f5f5f7; color: #1d1d1f; font-family: 'PT Serif', Georgia, serif; -webkit-font-smoothing: antialiased; min-height: 100%; }
    nav {
      background: rgba(245,245,247,0.92);
      border-bottom: 0.5px solid rgba(0,0,0,0.1);
      height: 52px;
      display: flex; align-items: center;
      padding: 0 28px;
      position: sticky; top: 0;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 100;
      justify-content: space-between;
    }
    nav a.brand {
      font-size: 1rem; font-weight: 700;
      color: #1d1d1f; text-decoration: none;
      letter-spacing: .04em;
    }
    nav .nav-links { display: flex; gap: 24px; }
    nav .nav-links a {
      font-size: .85rem; color: #1d1d1f;
      text-decoration: none; letter-spacing: .02em;
      opacity: 0.75; transition: opacity 0.2s;
    }
    nav .nav-links a:hover { opacity: 1; }
    .container { max-width: 860px; margin: 0 auto; padding: 56px 24px 80px; }
    h1 { font-size: clamp(1.8rem,4vw,2.6rem); font-weight: 700; margin-bottom: 12px; letter-spacing: -.01em; }
    h2 { font-size: 1.3rem; font-weight: 700; margin: 36px 0 12px; }
    p  { font-size: 1rem; line-height: 1.7; color: rgba(0,0,0,0.75); margin-bottom: 16px; }
    .card {
      background: #fff;
      border-radius: 18px;
      border: 0.5px solid rgba(0,0,0,0.08);
      padding: 32px;
      margin-bottom: 16px;
    }
    .pill-btn {
      display: inline-block;
      background: #1d1d1f; color: #fff;
      font-family: 'PT Serif', Georgia, serif;
      font-size: .9rem; letter-spacing: .04em;
      padding: 12px 32px;
      border-radius: 980px;
      border: none; cursor: pointer;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .pill-btn:hover { opacity: 0.82; }
    .form-group { margin-bottom: 24px; }
    .form-group label {
      display: block; font-size: .8rem;
      letter-spacing: .08em; text-transform: uppercase;
      color: rgba(0,0,0,0.5); margin-bottom: 8px;
    }
    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%; background: none;
      border: none; border-bottom: 1px solid rgba(0,0,0,0.2);
      padding: 8px 0; font-family: 'PT Serif', Georgia, serif;
      font-size: 1rem; color: #1d1d1f; outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus { border-bottom-color: #1d1d1f; }
    .form-group textarea { resize: vertical; min-height: 100px; }
    .accordion-item { border-bottom: 0.5px solid rgba(0,0,0,0.1); }
    .accordion-btn {
      width: 100%; background: none; border: none;
      display: flex; justify-content: space-between; align-items: center;
      padding: 20px 0; cursor: pointer;
      font-family: 'PT Serif', Georgia, serif;
      font-size: 1rem; color: #1d1d1f; text-align: left;
    }
    .accordion-icon { font-size: 1.2rem; transition: transform 0.3s; }
    .accordion-body { display: none; padding: 0 0 20px; color: rgba(0,0,0,0.7); line-height: 1.7; }
    .accordion-item.open .accordion-body { display: block; }
    .accordion-item.open .accordion-icon { transform: rotate(45deg); }
  </style>
</head>
<body>
<nav>
  <a class="brand" href="/">Hutton</a>
  <div class="nav-links">
    <a href="/services">Services</a>
    <a href="/faq">FAQ</a>
    <a href="/contact">Contact</a>
  </div>
</nav>
<div class="container">
  {% block content %}{% endblock %}
</div>
<script>
  document.querySelectorAll('.accordion-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      btn.closest('.accordion-item').classList.toggle('open');
    });
  });
</script>
</body>
</html>
