{% extends "base.html" %}
{% block title %}Lender Request — Hutton{% endblock %}
{% block content %}
<h1>Lender Request</h1>
<form method="POST">
<div class="form-group"><label>Institution Name</label><input type="text" name="institution_name" required /></div>
<div class="form-group"><label>Contact Name</label><input type="text" name="contact_name" required /></div>
<div class="form-group"><label>Email</label><input type="text" name="email" required /></div>
<div class="form-group"><label>Phone</label><input type="text" name="phone" required /></div>
<div class="form-group"><label>Property Address</label><input type="text" name="property_address" required /></div>
<div class="form-group"><label>Information Required</label><input type="text" name="information_required" required /></div>
<button type="submit" class="pill-btn">Submit</button>
</form>
{% endblock %}
