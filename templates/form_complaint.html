{% extends "base.html" %}
{% block title %}Complaint — Hutton{% endblock %}
{% block content %}
<h1>Complaint</h1>
<form method="POST">
<div class="form-group"><label>Unit / Building</label><input type="text" name="unit___building" required /></div>
<div class="form-group"><label>Your Name</label><input type="text" name="your_name" required /></div>
<div class="form-group"><label>Email</label><input type="text" name="email" required /></div>
<div class="form-group"><label>Nature of Complaint</label><input type="text" name="nature_of_complaint" required /></div>
<div class="form-group"><label>Date of Incident</label><input type="text" name="date_of_incident" required /></div>
<div class="form-group"><label>Details</label><input type="text" name="details" required /></div>
<button type="submit" class="pill-btn">Submit</button>
</form>
{% endblock %}
