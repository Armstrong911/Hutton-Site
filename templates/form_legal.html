{% extends "base.html" %}
{% block title %}Legal Request — Hutton{% endblock %}
{% block content %}
<h1>Legal Request</h1>
<form method="POST">
<div class="form-group"><label>Law Firm / Contact</label><input type="text" name="law_firm___contact" required /></div>
<div class="form-group"><label>Email</label><input type="text" name="email" required /></div>
<div class="form-group"><label>Phone</label><input type="text" name="phone" required /></div>
<div class="form-group"><label>Property Address</label><input type="text" name="property_address" required /></div>
<div class="form-group"><label>Nature of Request</label><input type="text" name="nature_of_request" required /></div>
<button type="submit" class="pill-btn">Submit</button>
</form>
{% endblock %}
