{% extends "base.html" %}
{% block title %}Strata Documents — Hutton{% endblock %}
{% block content %}
<h1>Strata Documents</h1>
<form method="POST">
<div class="form-group"><label>Your Name</label><input type="text" name="your_name" required /></div>
<div class="form-group"><label>Role (Owner/Realtor/Lender)</label><input type="text" name="role_owner_realtor_lender" required /></div>
<div class="form-group"><label>Email</label><input type="text" name="email" required /></div>
<div class="form-group"><label>Property Address</label><input type="text" name="property_address" required /></div>
<div class="form-group"><label>Documents Required</label><input type="text" name="documents_required" required /></div>
<button type="submit" class="pill-btn">Submit</button>
</form>
{% endblock %}
