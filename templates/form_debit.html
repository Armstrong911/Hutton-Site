{% extends "base.html" %}
{% block title %}Pre-Authorized Debit — Hutton{% endblock %}
{% block content %}
<h1>Pre-Authorized Debit</h1>
<form method="POST">
<div class="form-group"><label>Owner Name</label><input type="text" name="owner_name" required /></div>
<div class="form-group"><label>Unit Number / Building</label><input type="text" name="unit_number___building" required /></div>
<div class="form-group"><label>Bank Name</label><input type="text" name="bank_name" required /></div>
<div class="form-group"><label>Transit Number</label><input type="text" name="transit_number" required /></div>
<div class="form-group"><label>Account Number</label><input type="text" name="account_number" required /></div>
<div class="form-group"><label>Email</label><input type="text" name="email" required /></div>
<button type="submit" class="pill-btn">Submit</button>
</form>
{% endblock %}
