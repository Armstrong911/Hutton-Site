{% extends "base.html" %}
{% block title %}Realtor Request — Hutton{% endblock %}
{% block content %}
<h1>Realtor Request</h1>
<form method="POST">
<div class="form-group"><label>Agent Name</label><input type="text" name="agent_name" required /></div>
<div class="form-group"><label>Brokerage</label><input type="text" name="brokerage" required /></div>
<div class="form-group"><label>Email</label><input type="text" name="email" required /></div>
<div class="form-group"><label>Phone</label><input type="text" name="phone" required /></div>
<div class="form-group"><label>Property Address</label><input type="text" name="property_address" required /></div>
<div class="form-group"><label>Documents Required</label><input type="text" name="documents_required" required /></div>
<button type="submit" class="pill-btn">Submit</button>
</form>
{% endblock %}
